name: Asgard Security Suite - Automated CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    name: Run Unit & Integration Tests (All 9 Modules)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Asgard Suite Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Suite Dependencies & Test Runners
        # Each module pins its own requirements.txt (Bifrost needs
        # cryptography, Ragnarok needs PyJWT/chromadb, Forseti needs
        # python-multipart for its web UI, etc.) - a single hand-maintained
        # dependency list here always drifts out of sync with those, so
        # install every module's real requirements instead of guessing.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          for req in */requirements.txt Ragnarok/backend/requirements.txt Ragnarok/backend/requirements-rag.txt; do
            if [ -f "$req" ]; then
              echo "Installing $req"
              pip install -r "$req"
            fi
          done

      - name: Test Sleipnir (SOAR Engine)
        run: |
          cd Sleipnir
          pytest -v

      - name: Test Forseti (GDPR / NIS2 / DORA / ISO27001 Compliance)
        run: |
          cd Forseti
          pytest -v

      - name: Test Fenrir (Threat Intel & STIX 2.1)
        run: |
          cd Fenrir
          pytest -v

      - name: Test Heimdall (HIDS & Remote Agent)
        run: |
          cd Heimdall
          pytest -v

      - name: Test Bifrost (Network Scanner & CVE Correlation)
        run: |
          cd Bifrost
          pytest -v

      - name: Test Mjolnir (Forensic Triage & YARA Scanner)
        run: |
          cd Mjolnir
          pytest -v

      - name: Test Gjallarhorn (Alerting Hub & SIEM Exporter)
        run: |
          cd Gjallarhorn
          pytest -v

      - name: Test Yggdrasil (Active Directory Auditor)
        run: |
          cd Yggdrasil
          pytest -v

      - name: Test Ragnarök (Desktop & API Orchestrator)
        # Two separate invocations: tests/ and backend/tests/ both import
        # server.py/auth.py at module scope with process-wide side effects,
        # and running them in one pytest process leaks state between them
        # (see Ragnarok's own CI workflow for the same fix in more detail).
        run: |
          cd Ragnarok
          pytest tests/ -v
          pytest backend/tests/ -v

  lint:
    name: Static Analysis (pyflakes, zero-warning policy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Asgard Suite Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pyflakes over suite entry points
        # Same file list verified locally to be warning-free. Static analysis
        # only (no imports executed), so no module dependencies are needed.
        run: |
          pip install pyflakes
          python -m pyflakes Heimdall/main.py Heimdall/core Heimdall/api Mjolnir/main.py Mjolnir/core Bifrost/main.py Bifrost/core Bifrost/api Yggdrasil/main.py Yggdrasil/core Fenrir/main.py Fenrir/core Sleipnir/main.py Sleipnir/core Forseti/main.py Forseti/core Forseti/api Gjallarhorn/main.py Ragnarok/backend/server.py Ragnarok/backend/auth.py Ragnarok/backend/backup.py Ragnarok/backend/core Ragnarok/backend/routers run_suite_tests.py package_release.py

      - name: Shell syntax check (installers)
        # install.ps1 / Deploy-HeimdallAgent.ps1 are covered by the Windows
        # PowerShell parser locally; ubuntu runners only guarantee bash.
        run: |
          bash -n install.sh
          bash -n setup-express.sh
