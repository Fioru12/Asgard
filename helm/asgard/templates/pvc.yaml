apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asgard-rag-state
  labels: { app: asgard }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.persistence.size }} }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asgard-backups
  labels: { app: asgard }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.persistence.backupsSize }} }
