# Monitoring stack opzionale: Prometheus + Alertmanager + Loki + Grafana.
# Uso: docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
# Gli alert arrivano a Gjallarhorn via webhook (canale "webhook" configurato).
# Il project name DEVE coincidere con quello del compose principale ("asgard"):
# top-level `name:` identici → i container vengono gestiti dallo stesso progetto.
name: asgard

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: asgard-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/asgard-alerts.yml:/etc/prometheus/asgard-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: asgard-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: asgard-loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: asgard-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-asgard-admin}
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./docker/grafana/provisioning/dashboards/definitions:/etc/grafana/provisioning/dashboards/definitions:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
