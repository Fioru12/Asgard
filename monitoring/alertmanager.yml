# Alertmanager — route critical/high verso l'endpoint di compatibilità
# Gjallarhorn (/api/v1/notify/alertmanager). L'header X-API-Key DEVE
# coincidere con GJALLARHORN_API_KEY del servizio (default compose:
# "asgard-gjallarhorn-key"; sostituire con la key prodotta da rotate_keys.py).
global:
  resolve_timeout: 5m

route:
  receiver: gjallarhorn
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "critical"]
      receiver: gjallarhorn-urgent
      continue: true

receivers:
  - name: gjallarhorn
    webhook_configs:
      - url: http://gjallarhorn:8090/api/v1/notify/alertmanager
        send_resolved: true
        http_config:
          http_headers:
            X-API-Key:
              values:
                - asgard-gjallarhorn-key
  - name: gjallarhorn-urgent
    webhook_configs:
      - url: http://gjallarhorn:8090/api/v1/notify/alertmanager
        send_resolved: true
        http_config:
          http_headers:
            X-API-Key:
              values:
                - asgard-gjallarhorn-key
